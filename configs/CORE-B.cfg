!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname CORE-B
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree vlan 10 priority 8192
spanning-tree vlan 20 priority 8192
spanning-tree vlan 30 priority 8192
spanning-tree vlan 40 priority 8192
spanning-tree vlan 50 priority 8192
spanning-tree vlan 60 priority 8192
spanning-tree vlan 99 priority 8192
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 ip address 10.255.255.4 255.255.255.255
!
interface Port-channel1
 switchport mode trunk
!
interface FastEthernet0/0
 ip address 172.16.0.5 255.255.255.252
 ip ospf hello-interval 5
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 172.16.0.10 255.255.255.252
 ip ospf hello-interval 5
 duplex auto
 speed auto
!
interface FastEthernet1/0
!
interface FastEthernet1/1
 switchport mode trunk
 channel-group 1 mode on
!
interface FastEthernet1/2
 switchport mode trunk
 channel-group 1 mode on
!
interface FastEthernet1/3
 switchport mode trunk
!
interface FastEthernet1/4
!
interface FastEthernet1/5
!
interface FastEthernet1/6
!
interface FastEthernet1/7
!
interface FastEthernet1/8
!
interface FastEthernet1/9
!
interface FastEthernet1/10
!
interface FastEthernet1/11
!
interface FastEthernet1/12
!
interface FastEthernet1/13
!
interface FastEthernet1/14
!
interface FastEthernet1/15
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
!
interface Vlan10
 ip address 10.10.2.67 255.255.255.224
 standby 10 ip 10.10.2.65
 standby 10 priority 90
!
interface Vlan20
 ip address 10.10.0.3 255.255.255.0
 standby 20 ip 10.10.0.1
 standby 20 priority 90
!
interface Vlan30
 ip address 10.10.1.3 255.255.255.128
 standby 30 ip 10.10.1.1
 standby 30 priority 90
!
interface Vlan40
 ip address 10.10.1.195 255.255.255.192
 standby 40 ip 10.10.1.193
 standby 40 priority 90
!
interface Vlan50
 ip address 10.10.1.131 255.255.255.192
 standby 50 ip 10.10.1.129
 standby 50 priority 90
!
interface Vlan60
 ip address 10.10.2.3 255.255.255.192
 ip access-group ACL_AISLAR_INVITADOS in
 standby 60 ip 10.10.2.1
 standby 60 priority 90
!
interface Vlan99
 ip address 10.10.2.99 255.255.255.240
 standby 99 ip 10.10.2.97
 standby 99 priority 90
!
router ospf 1
 router-id 10.255.255.4
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet0/1
 network 10.10.0.0 0.0.255.255 area 0
 network 10.255.255.4 0.0.0.0 area 0
 network 172.16.0.4 0.0.0.3 area 0
 network 172.16.0.8 0.0.0.3 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ip access-list extended ACL_AISLAR_INVITADOS
 deny   ip 10.10.2.0 0.0.0.63 10.10.2.96 0.0.0.15 log
 deny   ip 10.10.2.0 0.0.0.63 10.0.0.0 0.255.255.255 log
 permit ip any any
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
