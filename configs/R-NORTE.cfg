interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
!
interface Vlan20
 description LAN_DATOS_NORTE
 ip address 10.20.0.1 255.255.255.0
!
interface Vlan30
 description LAN_VOIP_NORTE
 no ip address
!
router ospf 1
 router-id 10.255.255.5
 log-adjacency-changes
 network 10.20.0.0 0.0.255.255 area 10
 network 10.255.255.5 0.0.0.0 area 10
 network 172.16.10.0 0.0.0.3 area 10
 network 172.16.10.4 0.0.0.3 area 10
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 200.10.10.10
ip route 0.0.0.0 0.0.0.0 200.10.10.14 50
ip route 200.10.10.1 255.255.255.255 200.10.10.10
ip route 200.10.10.5 255.255.255.255 200.10.10.14
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
