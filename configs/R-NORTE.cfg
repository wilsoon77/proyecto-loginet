!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R-NORTE
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$xvAU$DCDWlPLD3AcoiqY6V4RQb0
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip domain name logiglobal.com
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
username admin privilege 15 secret 5 $1$uSao$m7v9IujZHBoTCF6ok6jia/
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
crypto isakmp key LogiVPNKey2026! address 200.10.10.1
crypto isakmp key LogiVPNKey2026! address 200.10.10.5
!
!
crypto ipsec transform-set TS_AES256 esp-aes 256 esp-sha-hmac 
 mode transport
!
crypto ipsec profile PERFIL_IPSEC_LOGI
 set transform-set TS_AES256 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 description IDENTIFICADOR_ROUTER_ID
 ip address 10.255.255.5 255.255.255.255
!
interface Tunnel10
 description VPN_PRIMARIA_HACIA_R-BORDE-1
 ip address 172.16.10.2 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf cost 10
 ip ospf hello-interval 5
 ip ospf 1 area 10
 tunnel source 200.10.10.9
 tunnel destination 200.10.10.1
 tunnel protection ipsec profile PERFIL_IPSEC_LOGI
!
interface Tunnel11
 description VPN_RESPALDO_HACIA_R-BORDE-2
 ip address 172.16.10.6 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf cost 100
 ip ospf hello-interval 5
 ip ospf 1 area 10
 tunnel source 200.10.10.13
 tunnel destination 200.10.10.5
 tunnel protection ipsec profile PERFIL_IPSEC_LOGI
!
interface FastEthernet0/0
 description WAN_PRINCIPAL_HACIA_ISP
 ip address 200.10.10.9 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description WAN_RESPALDO_HACIA_ISP
 ip address 200.10.10.13 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
 switchport access vlan 20
 spanning-tree portfast
!
interface FastEthernet1/1
