!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R-BORDE-1
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$eRJR$dQxinCNK419cf3RILoLSg1
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip domain name logiglobal.com
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree vlan 10 priority 4096
spanning-tree vlan 20 priority 4096
spanning-tree vlan 30 priority 4096
spanning-tree vlan 40 priority 4096
spanning-tree vlan 50 priority 4096
spanning-tree vlan 60 priority 4096
spanning-tree vlan 99 priority 4096
username admin privilege 15 secret 5 $1$vJSu$PdUz5TGrAORGU3DC/o8GY/
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
crypto isakmp key LogiVPNKey2026! address 200.10.10.17
crypto isakmp key LogiVPNKey2026! address 200.10.10.9
!
!
crypto ipsec transform-set TS_AES256 esp-aes 256 esp-sha-hmac 
 mode transport
!
crypto ipsec profile PERFIL_IPSEC_LOGI
 set transform-set TS_AES256 
!
!
!
!
ip tcp synwait-time 5
!
class-map match-any CLASE_VOIP_CRITICA
 match access-group name ACL_QOS_VOIP
 match ip dscp ef 
class-map match-any CLASE_ERP_TRANSACCIONAL
 match access-group name ACL_QOS_ERP
 match ip dscp af31 
class-map match-any CLASE_CCTV_MASIVO
 match access-group name ACL_QOS_CCTV
!
!
policy-map POLITICA_QOS_WAN
 class CLASE_VOIP_CRITICA
  set ip dscp ef
  priority percent 25
 class CLASE_ERP_TRANSACCIONAL
  set ip dscp af31
  bandwidth percent 35
 class CLASE_CCTV_MASIVO
  set ip dscp af11
    police 15000000 conform-action transmit  exceed-action drop 
 class class-default
  fair-queue
!
!
!
!
!
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
!
interface Tunnel10
 description VPN_PRIMARIA_HACIA_CD_NORTE
 ip address 172.16.10.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf cost 10
 ip ospf hello-interval 5
 ip ospf 1 area 10
 tunnel source 200.10.10.1
 tunnel destination 200.10.10.9
 tunnel protection ipsec profile PERFIL_IPSEC_LOGI
!
interface Tunnel20
 description VPN_HACIA_CD_SUR
 ip address 172.16.20.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf cost 10
 ip ospf hello-interval 5
 ip ospf 1 area 20
 tunnel source 200.10.10.1
 tunnel destination 200.10.10.17
 tunnel protection ipsec profile PERFIL_IPSEC_LOGI
!
interface FastEthernet0/0
 description ENLACE_L3_HACIA_CORE-A
 ip address 172.16.0.2 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 ip ospf hello-interval 5
 ip ospf 1 area 0
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description WAN_PRINCIPAL_HACIA_ISP
 ip address 200.10.10.1 255.255.255.252
 ip nat outside
 ip virtual-reassembly
 ip ospf hello-interval 5
 duplex auto
 speed auto
 service-policy output POLITICA_QOS_WAN
!
interface FastEthernet1/0
!
interface FastEthernet1/1
!
interface FastEthernet1/2
!
interface FastEthernet1/3
!
interface FastEthernet1/4
!
interface FastEthernet1/5
!
interface FastEthernet1/6
!
interface FastEthernet1/7
!
interface FastEthernet1/8
!
interface FastEthernet1/9
!
interface FastEthernet1/10
!
interface FastEthernet1/11
!
interface FastEthernet1/12
!
interface FastEthernet1/13
!
interface FastEthernet1/14
!
interface FastEthernet1/15
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
!
router ospf 1
 router-id 10.255.255.1
 log-adjacency-changes
 passive-interface default
 no passive-interface FastEthernet0/0
 no passive-interface FastEthernet0/1
 no passive-interface Tunnel10
 no passive-interface Tunnel20
 network 10.10.0.0 0.0.255.255 area 0
 network 10.255.255.1 0.0.0.0 area 0
 network 10.255.255.3 0.0.0.0 area 0
 network 172.16.0.0 0.0.0.3 area 0
 network 172.16.0.8 0.0.0.3 area 0
 network 172.16.10.0 0.0.0.3 area 10
 network 172.16.20.0 0.0.0.3 area 20
 default-information originate always
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 200.10.10.2
ip route 200.10.10.8 255.255.255.252 200.10.10.2
ip route 200.10.10.16 255.255.255.252 200.10.10.2
ip route 200.10.10.20 255.255.255.252 200.10.10.2
!
!
no ip http server
no ip http secure-server
ip nat inside source list 100 interface FastEthernet0/1 overload
ip nat inside source list ACL_NAT_INTERNET interface FastEthernet0/1 overload
!
ip access-list extended ACL_NAT_INTERNET
 deny   ip 10.0.0.0 0.255.255.255 10.0.0.0 0.255.255.255
 permit ip 10.0.0.0 0.255.255.255 any
ip access-list extended ACL_QOS_CCTV
 permit ip 10.10.1.192 0.0.0.63 any
ip access-list extended ACL_QOS_ERP
 permit ip host 10.10.2.100 any
 permit ip any host 10.10.2.100
ip access-list extended ACL_QOS_VOIP
 permit ip 10.10.1.0 0.0.0.127 any
 permit ip any 10.20.0.192 0.0.0.63
!
access-list 100 permit ip 10.0.0.0 0.255.255.255 any
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
