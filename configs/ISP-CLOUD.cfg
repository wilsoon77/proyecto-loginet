!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname ISP-CLOUD
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 description WAN_PRIMARIO_R-BORDE-1
 ip address 200.10.10.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description WAN_RESPALDO_R-BORDE-2
 ip address 200.10.10.6 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet1/0
 description PUERTO_L2_WAN_NORTE_PRI
 switchport access vlan 101
 spanning-tree portfast
!
interface FastEthernet1/1
 description PUERTO_L2_WAN_RESPALDO
 switchport access vlan 102
 spanning-tree portfast
!
interface FastEthernet1/2
 description PUERTO_L2_CLOUD_HYBRID
 switchport access vlan 103
 spanning-tree portfast
!
interface FastEthernet1/3
 switchport access vlan 103
 spanning-tree portfast
!
interface FastEthernet1/4
!
interface FastEthernet1/5
!
interface FastEthernet1/6
!
interface FastEthernet1/7
!
interface FastEthernet1/8
!
interface FastEthernet1/9
!
interface FastEthernet1/10
!
interface FastEthernet1/11
!
interface FastEthernet1/12
!
interface FastEthernet1/13
!
interface FastEthernet1/14
!
interface FastEthernet1/15
!
interface FastEthernet2/0
 description WAN_PRIMARIO_CD_SUR
 ip address 200.10.10.18 255.255.255.252
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
!
interface Vlan101
 description SVI_WAN_PRIMARIO_CD_NORTE
 ip address 200.10.10.10 255.255.255.252
!
interface Vlan102
 description SVI_WAN_RESPALDO_CD_NORTE
 ip address 200.10.10.14 255.255.255.252
!
interface Vlan103
 description SVI_PASARELA_VPC_CLOUD_HIBRIDA
 ip address 200.10.10.21 255.255.255.252
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
