!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R-BORDE-2
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$EiJ3$5CTdzQ6nqHgL.dkCjd2vC.
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
ip domain name logiglobal.com
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
username admin privilege 15 secret 5 $1$/x03$U/wVR0j27Iurv0WcEx7IX/
archive
 log config
  hidekeys
! 
!
crypto isakmp policy 10
 encr aes 256
 authentication pre-share
 group 5
crypto isakmp key LogiVPNKey2026! address 200.10.10.13
!
!
crypto ipsec transform-set TS_AES256 esp-aes 256 esp-sha-hmac 
 mode transport
!
crypto ipsec profile PERFIL_IPSEC_LOGI
 set transform-set TS_AES256 
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface Loopback0
 description IDENTIFICADOR_ROUTER_ID
 ip address 10.255.255.2 255.255.255.255
!
interface Tunnel11
 description VPN_RESPALDO_HACIA_CD_NORTE
 ip address 172.16.10.5 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf cost 100
 ip ospf hello-interval 5
 ip ospf 1 area 10
 tunnel source 200.10.10.5
 tunnel destination 200.10.10.13
 tunnel protection ipsec profile PERFIL_IPSEC_LOGI
!
interface FastEthernet0/0
 description ENLACE_L3_HACIA_CORE-B
 ip address 172.16.0.6 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 ip ospf hello-interval 5
 ip ospf 1 area 0
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description WAN_RESPALDO_HACIA_ISP
 ip address 200.10.10.5 255.255.255.252
 ip nat outside
 ip virtual-reassembly
 duplex auto
 speed auto
!
interface FastEthernet1/0
!
interface FastEthernet1/1
!
interface FastEthernet1/2
!
interface FastEthernet1/3
!
interface FastEthernet1/4
!
interface FastEthernet1/5
!
interface FastEthernet1/6
!
interface FastEthernet1/7
!
interface FastEthernet1/8
!
interface FastEthernet1/9
!
interface FastEthernet1/10
!
interface FastEthernet1/11
!
interface FastEthernet1/12
!
interface FastEthernet1/13
!
interface FastEthernet1/14
!
interface FastEthernet1/15
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface Vlan1
 no ip address
!
router ospf 1
 router-id 10.255.255.2
 log-adjacency-changes
 default-information originate metric 100
!
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 200.10.10.6
ip route 10.20.0.0 255.255.0.0 172.16.10.6 250
!
!
no ip http server
no ip http secure-server
ip nat inside source list ACL_NAT_INTERNET interface FastEthernet0/1 overload
!
ip access-list extended ACL_NAT_INTERNET
 deny   ip 10.0.0.0 0.255.255.255 10.0.0.0 0.255.255.255
 permit ip 10.0.0.0 0.255.255.255 any
!
no cdp log mismatch duplex
!
!
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
!
end
